# CI Workers Builds project name (repo: wuthering-wavescheats)
name = "wutheringwavescheat"
compatibility_date = "2026-01-01"
main = "src/worker.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Run Worker first so www/http → https://wutheringwavescheat.net 301s always apply
run_worker_first = true
